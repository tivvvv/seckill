services:
  seata-server:
    image: apache/seata-server:2.6.0
    container_name: seata-server
    ports:
      - "8091:8091"
    environment:
      STORE_MODE: db
      TZ: Asia/Shanghai
      JVM_XMS: 512m
      JVM_XMX: 512m
    volumes:
      - ./resources/application.yml:/seata-server/resources/application.yml
      - ./logs:/root/logs/seata
    restart: unless-stopped
